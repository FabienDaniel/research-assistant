[project]
name = "research-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arxiv>=4.0.1",
    "datasets>=5.0.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.4.2",
    "langchain-oracledb>=1.5.0",
    "openai>=2.53.0",
    "oracledb>=4.0.2",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "tavily-python>=0.7.27",
    "torch<=2.7.1",
]

# Driver 520.61.05 caps at CUDA 11.8. Default PyPI torch is a cu12 build needing driver >= 525.
# cu118 wheels stop at torch 2.7.1.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[tool.ruff]
# Original course notebook. It imports the removed helper.py and is kept for reference only.
extend-exclude = ["L5.ipynb"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
